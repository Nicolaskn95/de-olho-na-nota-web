<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" />

  <!-- Receipt / Note Sheet -->
  <g filter="url(#shadow)">
    <!-- Base Paper -->
    <path d="M 148 96 
             C 148 86, 156 78, 166 78 
             L 346 78 
             C 356 78, 364 86, 364 96 
             L 364 416 
             L 340 398 
             L 316 416 
             L 292 398 
             L 268 416 
             L 244 398 
             L 220 416 
             L 196 398 
             L 172 416 
             L 148 398 
             Z" 
          fill="url(#sheetGrad)" />

    <!-- Receipt Header Lines -->
    <rect x="184" y="116" width="144" height="12" rx="6" fill="#047857" opacity="0.8" />
    <rect x="184" y="140" width="96" height="8" rx="4" fill="#94a3b8" />
    <line x1="184" y1="168" x2="328" y2="168" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Items Preview Lines -->
    <rect x="184" y="190" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
    <rect x="296" y="190" width="32" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
    
    <rect x="184" y="212" width="70" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
    <rect x="296" y="212" width="32" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
  </g>

  <!-- Big Central Lens / Eye Badge ("De Olho") -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Glow Circle -->
    <circle cx="256" cy="300" r="72" fill="#ffffff" />
    <circle cx="256" cy="300" r="64" fill="url(#accentGrad)" />

    <!-- Eye Contour -->
    <path d="M 210 300 
             C 226 276, 286 276, 302 300 
             C 286 324, 226 324, 210 300 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Eye Pupil -->
    <circle cx="256" cy="300" r="16" fill="#ffffff" />
    <circle cx="256" cy="300" r="9" fill="#047857" />
    <circle cx="260" cy="296" r="3.5" fill="#ffffff" />
  </g>

  <!-- Scan Target Corners -->
  <path d="M 130 140 L 130 110 A 10 10 0 0 1 140 100 L 170 100" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 382 140 L 382 110 A 10 10 0 0 0 372 100 L 342 100" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 130 350 L 130 380 A 10 10 0 0 0 140 390 L 170 390" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 382 350 L 382 380 A 10 10 0 0 1 372 390 L 342 390" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>
